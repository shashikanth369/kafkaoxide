# Build-time workaround for a bug in the vendored librdkafka source shipped by
# rdkafka-sys 4.10.0+2.12.1 (pulled in by kafkaoxide-kafka's rdkafka dependency
# with the `cmake-build` feature). Full story in .build-stubs/curl/curl.h --
# read that before touching this.
#
# Short version: src/rdkafka_conf.c includes <curl/curl.h> unconditionally in
# practice (an `#ifdef` that should be `#if`), even when curl/OIDC support is
# fully disabled and no libcurl-dev is installed. CPATH points the compiler
# at a directory containing a *forwarding* shim curl/curl.h (using
# `#include_next`), not a plain empty stub: if this workspace is ever built
# on a machine that has a real curl/curl.h later in the include path (e.g.
# libcurl-dev installed, or the `ssl`+`curl` rdkafka features enabled), the
# shim steps aside and the real header is used, so it cannot silently shadow
# a real libcurl install.
#
# We looked at `-idirafter` (searched after system dirs, so it could never
# take priority over a real header at all) as an alternative to CPATH, which
# would avoid needing the forwarding trick above. It didn't pan out: cargo's
# `{ value = ..., relative = true }` path resolution for [env] treats the
# *entire* value as a path and prepends the config dir to it, so it cannot
# express a value like "-idirafter <abspath>" (composed flag + path) --
# tested, and it corrupts the flag into garbage. CFLAGS/CXXFLAGS are also
# workspace-global, so routing this through them would leak an extra
# `-idirafter` flag into every C/C++ build in the workspace (e.g. libz-sys),
# not just rdkafka-sys's. CPATH + the forwarding shim below gets the same
# safety property (never shadows a real header) without either problem.
[env]
CPATH = { value = ".build-stubs", relative = true, force = false }
